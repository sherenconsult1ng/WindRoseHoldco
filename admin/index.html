  <body>
    <!--
      Decap CMS admin. Log in here with your GitHub account (must have push
      access to this repo) to add/edit News posts and Products, including
      PDF/file uploads. Publishing here commits real files into the repo,
      so content and files are visible to every visitor on every device —
      unlike the old localStorage-based admin.html panel.

      Setup still required before this works (one-time, done by the repo
      owner, not by editors):
        1. Deploy a free OAuth proxy (see /admin/config.yml comments).
        2. Create a GitHub OAuth App pointing at that proxy.
        3. Fill in the `repo`, `branch` and `base_url` values in config.yml.
    -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
