<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wind Rose Holding Limited — News</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="nav-row">
    <div class="brand">
      <span class="brand-mark">Wind Rose Holding Limited</span>
      <span class="brand-sub">Est. Hong Kong</span>
    </div>
    <nav class="nav-links">
      <a href="index.html">About Us</a>
      <a href="product.html">Product</a>
      <a href="news.html" class="active">News</a>
      <a href="contact.html">Contact Us</a>
    </nav>
    <div class="nav-auth" id="auth-slot"><a class="btn btn-ghost" href="product.html">Member Login</a></div>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <div class="section-title">Market &amp; Company Updates</div>
    <h1>News</h1>
    <p class="lead">The latest announcements and market information from Wind Rose Holding Limited.</p>
  </div>
</section>

<section class="section">
  <div class="container" id="news-list">
      <!-- news items will be rendered here by app.js -->
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    © <span id="year">2026</span> Wind Rose Holding Limited. All rights reserved. ·
    <a href="contact.html">Contact Us</a>
  </div>
</footer>

<script src="app.js"></script>

<script>
  // Render news items (including uploaded files and captions) for site visitors.
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.getElementById("news-list");
    if (!container || typeof getNews !== 'function') return;

    const news = getNews();
    if (!news || news.length === 0) {
      container.innerHTML = '<p class="empty-state">No news available.</p>';
      return;
    }

    // Helper to safely download or open resources. For data: and blob: URLs we open them directly.
    async function tryDownload(event, url, filename) {
      event.preventDefault();
      try {
        // If it's a data: or blob: URL — open directly in the same tab so the user can view it immediately.
        if (String(url).startsWith('data:') || String(url).startsWith('blob:')) {
          window.open(url, '_self');
          return;
        }

        // For common viewable extensions, open in same tab after fetching to create an object URL.
        const viewableExt = /\.(pdf|txt|html?|md)(\?.*)?$/i;
        const isViewableByExt = viewableExt.test(filename || '');

        const resp = await fetch(url, { mode: 'cors' });
        if (!resp.ok) throw new Error('Network response not OK');
        const blob = await resp.blob();
        const objectUrl = URL.createObjectURL(blob);

        if (isViewableByExt || blob.type.startsWith('image/') || blob.type === 'application/pdf' || blob.type.startsWith('text/')) {
          // Open in the same tab for quick viewing.
          window.open(objectUrl, '_self');
        } else {
          // Trigger a download for other file types.
          const a = document.createElement('a');
          a.style.display = 'none';
          a.href = objectUrl;
          if (filename) a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
        }

        // Revoke object URL after some time.
        setTimeout(() => URL.revokeObjectURL(objectUrl), 5000);
      } catch (err) {
        // Fallback: open the URL in the same tab (best-effort) — avoids leaving the user with a broken UI.
        try { window.open(url, '_self'); } catch (e) { window.open(url, '_blank'); }
      }
    }

    container.innerHTML = news.map(n => {
      const hasFile = n.fileName && n.fileData;
      let fileHtml = '—';

      if (hasFile) {
        const fileData = String(n.fileData);
        const safeFileName = escapeHtml(n.fileName || 'attachment');

        // Image preview + download link for images (click opens directly in the same tab)
        if (fileData.startsWith('data:image/') || fileData.startsWith('blob:') || /\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(n.fileName || '')) {
          fileHtml = `
            <div class="news-file">
              <a href="${fileData}" rel="noopener noreferrer">
                <img src="${fileData}" alt="${safeFileName}" style="max-width:100%;height:auto;border-radius:6px;margin-top:10px;">
              </a>
            </div>
            <div style="margin-top:6px;">
              <a href="${fileData}" class="news-open" data-filename="${safeFileName}" style="color:var(--accent);text-decoration:underline;">🔍 Open</a>
              &nbsp;·&nbsp;
              <a href="${fileData}" download="${safeFileName}" style="color:var(--accent);text-decoration:underline;">📥 Download</a>
            </div>
            ${n.caption ? `<div class="hint-text" style="margin-top:6px;">${escapeHtml(n.caption)}</div>` : ''}
          `;
        } else {
          // Non-image files: show an open/download link and use tryDownload handler for better cross-browser behaviour.
          fileHtml = `
            <div>
              <a href="${fileData}" class="news-download" data-filename="${safeFileName}" style="color:var(--accent);text-decoration:underline;">📎 ${safeFileName}</a>
              ${n.caption ? `<div class="hint-text" style="margin-top:6px;">${escapeHtml(n.caption)}</div>` : ''}
            </div>
          `;
        }
      }

      return `
        <div class="card news-item">
          <div class="date">${escapeHtml(n.date)}</div>
          <h3>${escapeHtml(n.title)}</h3>
          <p>${escapeHtml(n.body || '')}</p>
          <div class="news-file-wrap">${fileHtml}</div>
        </div>
      `;
    }).join('');

    // After inserting, bind click handlers for .news-download and .news-open links to use the fetch+open/download fallback.
    Array.from(container.querySelectorAll('.news-download')).forEach(a => {
      a.addEventListener('click', (ev) => {
        const url = a.getAttribute('href');
        const filename = a.getAttribute('data-filename') || '';
        tryDownload(ev, url, filename);
      });
    });

    Array.from(container.querySelectorAll('.news-open')).forEach(a => {
      a.addEventListener('click', (ev) => {
        const url = a.getAttribute('href');
        const filename = a.getAttribute('data-filename') || '';
        // For open we prefer to open in the same tab for immediate viewing.
        tryDownload(ev, url, filename);
      });
    });
  });

  // Basic HTML escaping to avoid injecting stored strings directly into markup.
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
</script>

</body></html>
